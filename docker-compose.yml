services:
  faixora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faixora-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
